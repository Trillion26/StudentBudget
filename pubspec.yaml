name: student_budget
description: "Plan and track a monthly student budget in rand, entirely on your iPhone."
publish_to: 'none'

# Bump this before tagging a release (e.g. 1.0.1+2, then tag v1.0.1).
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  # Pinned Flutter version. GitHub Actions reads this line too.
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  fl_chart: ^1.2.0
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  intl: ^0.20.3
  uuid: ^4.6.0
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

# Run `dart run flutter_launcher_icons` after changing assets/icon/app_icon.png.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  ios: true
  android: false
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1B2766"
    theme_color: "#1B2766"
  windows:
    generate: true
    icon_size: 256
