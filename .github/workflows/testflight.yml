# OPTIONAL and OFF by default. Only runs when started by hand from the
# Actions tab. It needs a paid Apple Developer Program membership and the
# secrets listed in README.md ("Optional: TestFlight").
name: TestFlight upload (optional)

on:
  workflow_dispatch:

jobs:
  testflight:
    name: Sign and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Stop if the secrets are not set up
        run: |
          for name in BUNDLE_ID TEAM_ID PROFILE_NAME P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "Missing secret for $name. See README.md, 'Optional: TestFlight'."; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get packages and test
        run: |
          flutter pub get
          flutter test

      - name: Write the certificate and profile to disk
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "CERT_PATH=$RUNNER_TEMP/dist.p12" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$RUNNER_TEMP/app.mobileprovision" >> "$GITHUB_ENV"

      - name: Prepare the Xcode project
        run: flutter build ios --release --config-only --build-number=${{ github.run_number }}

      - name: Sign and upload with fastlane
        working-directory: ios
        run: |
          bundle install
          bundle exec fastlane ios testflight_upload
