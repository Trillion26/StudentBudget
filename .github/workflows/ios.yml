# Builds the unsigned iPhone app (StudentBudget.ipa) on a free macOS machine.
# Runs on every push to main and on version tags such as v1.0.0.
# On a version tag it also publishes the .ipa on a GitHub Release.
name: iPhone build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release on tags

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Test and build StudentBudget.ipa
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Flutter (version pinned in pubspec.yaml)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test

      - name: Run integration tests on an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in sorted(devices.items(), reverse=True) if "iOS" in runtime
                    for d in items if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test -d "$UDID"

      - name: Build the iPhone app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package StudentBudget.ipa
        run: |
          rm -rf Payload StudentBudget.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry StudentBudget.ipa Payload
          ls -lh StudentBudget.ipa

      - name: Upload the .ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentBudget-ipa
          path: StudentBudget.ipa
          retention-days: 30

      - name: Publish a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StudentBudget.ipa
          generate_release_notes: true
          body: |
            Download **StudentBudget.ipa** below and follow INSTALL-ON-IPHONE.md to install it with SideStore or AltStore.
            Save a backup in the app (Budget › Settings › Save backup) before reinstalling.
